  document.addEventListener('DOMContentLoaded', () => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    document.querySelectorAll('[data-gallery-carousel]').forEach((carousel) => {
      const slides = Array.from(carousel.querySelectorAll('[data-gallery-slide]'));
      const previous = carousel.querySelector('[data-gallery-previous]');
      const next = carousel.querySelector('[data-gallery-next]');
      const status = carousel.querySelector('[data-gallery-status]');
      let currentIndex = 0;
      let autoplayTimer;

      let isAnimating = false;
      let animationTimer;

      const updateAccessibility = () => {
        slides.forEach((slide, index) => {
          const isActive = index === currentIndex;
          slide.setAttribute('aria-hidden', String(!isActive));
          if (slide.matches('a')) slide.tabIndex = isActive ? 0 : -1;
        });
        status.textContent = `Photo ${currentIndex + 1} of ${slides.length}`;
      };

      const showSlide = (newIndex, direction = 1) => {
        const targetIndex = (newIndex + slides.length) % slides.length;
        if (targetIndex === currentIndex || isAnimating) return;

        const outgoingSlide = slides[currentIndex];
        const incomingSlide = slides[targetIndex];
        const enteringClass = direction > 0 ? 'is-entering-right' : 'is-entering-left';
        const exitingClass = direction > 0 ? 'is-exiting-left' : 'is-exiting-right';

        isAnimating = true;
        incomingSlide.classList.add(enteringClass);
        incomingSlide.getBoundingClientRect();

        outgoingSlide.classList.remove('is-active');
        outgoingSlide.classList.add(exitingClass);
        incomingSlide.classList.remove(enteringClass);
        incomingSlide.classList.add('is-active');
        currentIndex = targetIndex;
        updateAccessibility();

        window.clearTimeout(animationTimer);
        animationTimer = window.setTimeout(
          () => {
            outgoingSlide.classList.remove(exitingClass);
            isAnimating = false;
          },
          reduceMotion ? 0 : 500
        );
      };

      const stopAutoplay = () => {
        window.clearInterval(autoplayTimer);
        autoplayTimer = undefined;
      };

      const startAutoplay = () => {
        if (reduceMotion || autoplayTimer) return;
        autoplayTimer = window.setInterval(() => showSlide(currentIndex + 1, 1), 1800);
      };

      const changeSlide = (step) => {
        showSlide(currentIndex + step, step);
        if (autoplayTimer) {
          stopAutoplay();
          startAutoplay();
        }
      };

      previous.addEventListener('click', () => changeSlide(-1));
      next.addEventListener('click', () => changeSlide(1));
      carousel.addEventListener('mouseenter', startAutoplay);
      carousel.addEventListener('mouseleave', stopAutoplay);
      carousel.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          changeSlide(-1);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          changeSlide(1);
        }
      });

      updateAccessibility();
    });
  });
